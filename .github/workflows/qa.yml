name: repository-qa

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install release-test dependencies
        run: python -m pip install openpyxl==3.1.5 pytest==8.4.2
      - name: Verify release contract
        run: python scripts/verify_release.py
      - name: Run tests
        run: python -m pytest -q

